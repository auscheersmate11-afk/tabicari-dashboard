<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>旅キャリ 予約の流れ動画</title>
<style>
:root{--navy:#010952;--yellow:#FFD817}
body{margin:0;background:var(--navy);color:#fff;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}p.lead{margin:0 0 20px;opacity:.8;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:#0b1670;border-radius:14px;padding:12px}
.card h2{font-size:15px;margin:0 0 4px;color:var(--yellow)}.card p{font-size:12px;margin:0 0 8px;opacity:.8}
video{width:100%;aspect-ratio:9/16;border-radius:10px;background:#000}
a.dl{display:block;margin-top:8px;text-align:center;background:var(--yellow);color:var(--navy);font-weight:700;border-radius:999px;padding:8px;text-decoration:none;font-size:14px}
</style></head><body><main>
<h1>旅キャリ 予約の流れ動画</h1>
<p class="lead">面談予約（LINE追加 → カレンダー予約）の流れを見せる縦動画です。</p>
<div class="grid">
<div class="card"><h2>LINE案内用</h2><p>友だち追加後のLINEで送る用（UTAGE）</p><video src="line.mp4" poster="thumb.jpg" controls playsinline preload="none"></video><a class="dl" href="line.mp4" download="旅キャリ面談_予約の流れ_LINE案内用.mp4">ダウンロード</a></div>
<div class="card"><h2>インスタDM用</h2><p>インスタのDMで送る用</p><video src="dm.mp4" poster="thumb.jpg" controls playsinline preload="none"></video><a class="dl" href="dm.mp4" download="旅キャリ面談_予約の流れ_インスタDM用.mp4">ダウンロード</a></div>
<div class="card"><h2>インスタDM用（軽量版）</h2><p>DMで重くて送れないとき用</p><video src="dm_light.mp4" poster="thumb.jpg" controls playsinline preload="none"></video><a class="dl" href="dm_light.mp4" download="旅キャリ面談_予約の流れ_インスタDM用_軽量版.mp4">ダウンロード</a></div>
<div class="card"><h2>LINE案内用（軽量版・予備）</h2><p>容量制限で上が入らないとき用</p><video src="line_light.mp4" poster="thumb.jpg" controls playsinline preload="none"></video><a class="dl" href="line_light.mp4" download="旅キャリ面談_予約の流れ_LINE案内用_軽量版.mp4">ダウンロード</a></div>
</div></main></body></html>
